[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# public/ files are served by the CDN without passing through Next, so the
# agent-file headers in next.config.ts are repeated here. Keep the two in step.
# X-Robots-Tag keeps these machine files out of search results; robots.txt must not block them.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/AGENTS.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/skill/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/rules/*"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/components.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/r/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=600, stale-while-revalidate=86400"
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
